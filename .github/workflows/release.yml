name: Release Windows

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate app icons
        run: |
          pip install pillow
          python scripts/generate_icon.py

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.2
          releaseName: "NotchKu v0.1.2"
          releaseBody: |
            NotchKu v0.1.2 — interactive notch for Windows.

            Download `NotchKu_0.1.2_x64-setup.exe` below, run it, and press `Alt+N` to open the notch.
            Windows SmartScreen may warn because the installer is not code-signed yet — click "More info" → "Run anyway".
          releaseDraft: false
          prerelease: false
